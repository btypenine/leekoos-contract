<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>리쿠스 조직도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* Layout: sticky header, org tree (CEO pair → exec + 경영지원 → dept columns), bottom sheet for person / settings */
  :root{
    --bg:#eef1f6; --card:#ffffff; --soft:#f4f6fa; --ink:#18202e; --muted:#5d6879; --line:#dbe1ea;
    --navy:#1f3864; --accent:#1f3864; --ok:#177a43; --okbg:#e6f5ec; --danger:#b42318;
    --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#10141b; --card:#19202b; --soft:#202836; --ink:#e7ebf2; --muted:#9aa5b6; --line:#2b3442; --navy:#a8c0ee; --accent:#a8c0ee; --ok:#5ccf8a; --okbg:#173326; --danger:#ff8a80; color-scheme:dark } }
  :root[data-theme="dark"]{ --bg:#10141b; --card:#19202b; --soft:#202836; --ink:#e7ebf2; --muted:#9aa5b6; --line:#2b3442; --navy:#a8c0ee; --accent:#a8c0ee; --ok:#5ccf8a; --okbg:#173326; --danger:#ff8a80; color-scheme:dark }
  html,body{margin:0}*{box-sizing:border-box} [hidden]{display:none!important}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{display:flex;align-items:center;gap:10px;max-width:980px;margin:0 auto}
  .top img{height:26px;background:#fff;border-radius:4px;padding:2px}
  .top h1{font-size:17px;margin:0;color:var(--navy);white-space:nowrap;font-weight:700}
  .top .sp{flex:1}
  .gear{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .bar{display:flex;gap:8px;max-width:980px;margin:10px auto 0}
  .tabs{display:flex;background:var(--soft);border-radius:10px;padding:3px;flex:none}
  .tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;font:inherit;font-size:14px;color:var(--muted);font-weight:600;cursor:pointer}
  .tabs button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .search{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:15px;background:var(--card);color:var(--ink)}
  main{max-width:980px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .lvl{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;align-items:stretch}
  .stem{width:2px;height:22px;background:var(--line);margin:0 auto}
  .boss{background:var(--card);border:2px solid var(--navy);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:130px;cursor:pointer}
  .boss .role{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}
  .staff{display:flex}.staff .dept{flex:1}
  .strow{display:grid;grid-template-columns:1fr auto 1fr;align-items:start}
  .strow .vline{background:var(--line)}
  .side{display:flex;flex-direction:column;gap:10px;padding-left:14px;padding-top:32px;position:relative;justify-content:flex-start}
  .side .staff{width:100%;max-width:230px}
  .depts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;position:relative;padding-top:22px}
  .depts::before{content:"";position:absolute;top:0;left:10%;right:10%;height:2px;background:var(--line)}
  .dept{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
  .depts .dept::before{content:"";position:absolute;top:-22px;left:50%;width:2px;height:22px;background:var(--line)}
  .dept h2{margin:0;font-size:14px;color:#fff;padding:9px 12px;text-align:center;font-weight:700}
  .dept ul{list-style:none;margin:0;padding:8px}
  .dept li{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:10px;cursor:pointer}
  .dept li:hover{background:var(--soft)}
  .av{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;background-size:cover;background-position:center 22%;background-color:#c7cfdb;position:relative}
  .boss .av{width:64px;height:64px;font-size:18px}
  .cnt{position:absolute;right:-4px;bottom:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--ok);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--card)}
  .nm{font-size:15px;font-weight:700}
  .tt{font-size:12.5px;color:var(--muted)}
  .who{min-width:0}
  .grp{font-size:13px;font-weight:700;color:var(--muted);margin:18px 4px 8px}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
  .row .who{flex:1}
  .ph{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .box{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:90vh;overflow:auto}
  .head{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
  .big{width:120px;height:120px;font-size:36px;cursor:pointer}
  .hint{font-size:12px;color:var(--muted)}
  .nmb{font-size:20px;font-weight:700;margin-top:6px}
  .phone{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
  .phone span{font-size:17px;font-variant-numeric:tabular-nums;user-select:all}
  .btn{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .btn.pri{background:var(--navy);border-color:var(--navy);color:var(--card)}
  .btn.ok{background:var(--okbg);border-color:transparent;color:var(--ok)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.close{width:100%;justify-content:center;margin-top:16px;padding:12px}
  .sec{font-size:14px;font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:6px}
  .sec small{font-weight:400;color:var(--muted)}
  .note{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;text-align:left}
  .note .by{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .note .by img{width:18px;height:18px;border-radius:50%}
  .note .by b{color:var(--ink);font-weight:600}
  .note .tx{font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .note .ops{display:flex;gap:10px;margin-top:6px}
  .link{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;padding:0}
  .link.del{color:var(--danger)}
  .reps{margin:8px 0 0 12px;padding-left:10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .rep .tx{font-size:14px}
  .write{display:flex;gap:8px;margin-top:8px}
  .write textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:15px;background:var(--card);color:var(--ink);resize:vertical;min-height:42px}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px}
  .gal figure{margin:0;text-align:center}
  .gal img{width:100%;aspect-ratio:1;object-fit:cover;object-position:center 22%;border-radius:12px;border:2px solid transparent;cursor:pointer;background:var(--soft)}
  .gal figure.cur img{border-color:var(--ok)}
  .gal figcaption{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
  .viewer{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:var(--soft)}
  .srow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
  .srow .who{flex:1}
  .srow input[type=file]{display:none}
  .msg{font-size:13px;color:var(--ok);min-height:18px;margin-top:8px}
  .msg.err{color:var(--danger)}
  .banner{max-width:980px;margin:0 auto 12px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--muted)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:560px){ .depts{grid-template-columns:1fr;padding-top:0} .depts::before,.depts .dept::before{display:none} .side{padding-left:8px} .side .dept h2{font-size:12.5px;padding:7px 4px;white-space:nowrap} .side .dept h2 span{display:none} .side .dept ul{padding:6px} .side .dept li{flex-direction:column;text-align:center;gap:4px;padding:6px 2px} .side .dept .tt{white-space:nowrap} }
  @media (prefers-reduced-motion:no-preference){ .box{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
  .field{display:block;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink);margin-top:6px}
  .lab{display:block;font-size:13px;font-weight:700;margin-top:14px;text-align:left}
  .me{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 12px;margin:12px 0 4px;font-size:13.5px}
  .me b{flex:1}
  .guide{margin-top:12px;text-align:left}
  .guide details{border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-top:8px;background:var(--soft)}
  .guide summary{font-weight:700;font-size:14px;padding:11px 0;cursor:pointer}
  .guide ol,.guide ul{margin:0 0 12px;padding-left:20px;font-size:13.5px;line-height:1.65}
  .guide li{margin-bottom:6px}
  .guide code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:12.5px}
  .idbox{border:1px solid #f0c36d;background:#fff8e6;border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .idwarn{font-size:13.5px;line-height:1.5;color:#7a4b00;margin-bottom:6px}
  .idrow{display:flex;gap:8px}.idrow .field{margin-top:0;flex:1;min-width:0}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .idbox{background:#2d2614;border-color:#6b5320} :root:not([data-theme="light"]) .idwarn{color:#f3d08a} }
</style>
</head>

<script>
(function(){
  "use strict";
  var API="https://script.google.com/macros/s/AKfycbw-KJ4WuNCnkIy3FyhxKk3z-f-uUWc7ZqamSLg_ybUn2VvsvPmA9S1KnQ1CWQoNt9og/exec";
  var D=JSON.parse(document.getElementById("orgdata").textContent);
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function tel(p){ return String(p||"").replace(/[^0-9+]/g,""); }
  function fmt(iso){ var d=new Date(iso); if(isNaN(d)) return ""; function z(n){return (n<10?"0":"")+n;} return (d.getMonth()+1)+"/"+d.getDate()+" "+z(d.getHours())+":"+z(d.getMinutes()); }
  function fmtDate(iso){ var d=new Date(iso); return isNaN(d)?"":d.getFullYear()+"."+(d.getMonth()+1)+"."+d.getDate(); }
  function each(list,fn){ Array.prototype.forEach.call(list,fn); }

  // ---------- people ----------
  var all=[];
  D.ceo.forEach(function(p){ all.push({p:p,dept:"대표이사",color:"#1f3864"}); });
  D.exec.forEach(function(p){ all.push({p:p,dept:"임원",color:"#475569"}); });
  (D.staff||[]).forEach(function(d){ d.members.forEach(function(p){ all.push({p:p,dept:d.name,color:d.color}); }); });
  D.depts.forEach(function(d){ d.members.forEach(function(p){ all.push({p:p,dept:d.name,color:d.color}); }); });
  all.forEach(function(x,i){ x.i=i; });
  function byName(n){ for(var i=0;i<all.length;i++) if(all[i].p.name===n) return all[i]; }

  // ---------- this device (이름·코드는 이 기기에만 저장) ----------
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
  if(lsGet("lk_api")) API=lsGet("lk_api");
  var ME={ name:lsGet("lk_name")||"", code:lsGet("lk_code")||"", admin:lsGet("lk_admin")==="1", key:lsGet("lk_key") };
  if(!ME.key){ var r=new Uint8Array(16); (window.crypto||{}).getRandomValues ? crypto.getRandomValues(r) : r.forEach(function(_,i){ r[i]=Math.random()*256|0; });
    ME.key=Array.prototype.map.call(r,function(b){ return ("0"+b.toString(16)).slice(-2); }).join(""); lsSet("lk_key",ME.key); }
  var MINE={}; try{ MINE=JSON.parse(lsGet("lk_mine")||"{}")||{}; }catch(e){}
  function markMine(id){ MINE[id]=1; lsSet("lk_mine",JSON.stringify(MINE)); }
  function signedIn(){ return !!(API && ME.name && ME.code); }

  // ---------- shared state (Google 시트) ----------
  var NOTES=[], PHOTOS=[], IMG={}, LOADED=false, BUSY={};
  function photosOf(name){ return PHOTOS.filter(function(r){ return r.person===name; }).sort(function(a,b){ return String(b.at).localeCompare(String(a.at)); }); }
  function imgOf(id){ if(IMG[id]) return IMG[id]; var c=lsGet("lk_img_"+id); if(c){ IMG[id]=c; return c; } return ""; }
  function photoURL(x){ var h=photosOf(x.p.name); for(var i=0;i<h.length;i++){ var u=imgOf(h[i].id); if(u) return u; } return x.p.photo||""; }
  function notesOf(name){ return NOTES.filter(function(n){ return n.person===name && !n.parent; }).sort(function(a,b){ return String(b.at).localeCompare(String(a.at)); }); }
  function repliesOf(id){ return NOTES.filter(function(n){ return n.parent===id; }).sort(function(a,b){ return String(a.at).localeCompare(String(b.at)); }); }

  function apiErr(j){ var m={code:"회사 코드가 맞지 않습니다",admin:"관리자 코드가 필요합니다",self:"사진은 본인만 바꿀 수 있습니다",short:"코드가 너무 짧습니다 (글쓰기 4자, 관리자 6자 이상)",same:"두 코드를 다르게 정해 주세요",name:"이름을 먼저 정해 주세요",owner:"본인이 쓴 글만 지울 수 있습니다",size:"사진이 너무 큽니다",empty:"내용을 입력해 주세요"}; return {code:m[j.err]||j.err||"오류"}; }
  function get(q){ return fetch(API+"?"+q,{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){ if(!j.ok) throw apiErr(j); return j; }); }
  function post(o){ o.code=ME.code; o.by=ME.name; o.key=ME.key;
    return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)})
      .then(function(r){ return r.json(); }).then(function(j){ if(!j.ok){ if(j.err==="code" && o.a!=="check"){ ME.code=""; ME.admin=false; lsSet("lk_code",null); lsSet("lk_admin",null); throw {code:"회사 코드가 바뀌었습니다. 다시 입력해 주세요"}; } throw apiErr(j); } return j; }); }

  function load(){
    if(!API) return Promise.resolve();
    return get("a=list").then(function(j){
      NOTES=j.notes||[]; PHOTOS=j.photos||[]; LOADED=true; $("banner").hidden=true; draw();
      var want=[]; all.forEach(function(x){ var h=photosOf(x.p.name); if(h.length && !imgOf(h[0].id)) want.push(h[0].id); });
      return fetchImgs(want);

  // ---------- photo upload ----------
  function shrink(file){ return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){ var s=Math.min(1,640/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.82)); };
    img.onerror=function(){ URL.revokeObjectURL(url); rej({code:"이미지를 읽지 못함"}); };
    img.src=url; }); }
  function uploadPhoto(x,file,msgEl){
    if(!canPhoto(x)){ msgEl.className="msg err"; msgEl.textContent="사진은 본인만 바꿀 수 있습니다."; return; }
    msgEl.className="msg"; msgEl.textContent=x.p.name+" 님 사진 올리는 중…";
    var durl;
    shrink(file).then(function(d){ durl=d; return post({a:"photo",person:x.p.name,data:d.split(",")[1]}); })
      .then(function(j){ markMine(j.id); IMG[j.id]=durl; lsSet("lk_img_"+j.id,durl); var t=x.p.name+" 님 사진을 올렸습니다. 모두에게 보입니다.", id=msgEl.id; return load().then(function(){ var m=$(id); if(m){ m.className="msg"; m.textContent=t; } }); })
      .catch(function(e){ msgEl=$(msgEl.id)||msgEl; msgEl.className="msg err"; msgEl.textContent="사진을 올리지 못했습니다 ("+(e&&e.code||"연결 오류")+")."; });
  }

        '<li><b>배포 → 새 배포 → 웹 앱</b> · 실행: <b>나</b> · 액세스: <b>모든 사용자</b> → 배포 → <b>…/exec</b> 주소 복사</li>'+

      '<div class="hint" style="margin-top:6px">⚠ Code.gs와 관리자 코드는 GitHub·단톡방에 올리지 마세요.</div></div>';

      '<label class="lab" for="aUrl">구글 웹 앱 URL (…/exec)</label><input class="field" id="aUrl" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(API)+'">'+
      '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn pri" type="button" id="aTest">연결 시험</button><button class="btn" type="button" id="aGet">모두에게 적용할 org.html 받기</button></div>'+
      '<div class="msg" id="amsg1"></div>';
    h+='<div class="sec">② 관리자 로그인</div>';
    if(isAdmin) h+='<div class="me">🔑 <b>'+esc(ME.name)+' (관리자)</b><button class="link" type="button" id="aOut">로그아웃</button></div>';
    else h+='<label class="lab" for="aName">내 이름</label><select class="field" id="aName">'+all.map(function(x){ return '<option'+(x.p.name===(ME.name||"구성민")?' selected':'')+'>'+esc(x.p.name)+'</option>'; }).join("")+'</select>'+
      '<label class="lab" for="aCode">관리자 코드</label><input class="field" id="aCode" type="password" autocomplete="off"><button class="btn pri" type="button" id="aLogin" style="margin-top:8px"'+(API?'':' disabled')+'>관리자로 로그인</button>';

        '<button class="btn pri" type="button" id="aSet" style="margin-top:8px">코드 저장</button><div class="msg" id="amsg3"></div>';

        function(e){ b.disabled=false; say("amsg3","저장하지 못했습니다 ("+(e&&e.code||"오류")+")",1); }); };
    each($("sbox").querySelectorAll("[data-adel]"),function(b){ b.onclick=function(){
