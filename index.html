<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리쿠스 근로계약서</title>
<style>
  :root{--navy:#1f3864;--ink:#1b1f27;--muted:#5b6474;--line:#d5dae3;--bg:#eef1f5;--panel:#fff;--accent:#2f5aa8;--danger:#b42318;--ok:#167a3e;--warn:#9a6700}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  .hidden{display:none !important}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .login-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 28px;box-shadow:0 10px 30px rgba(20,30,60,.08)}
  .login-card img{height:38px;display:block;margin:0 auto 14px}
  .login-card h1{font-size:18px;text-align:center;margin:0 0 4px;color:var(--navy)}
  .login-card p{font-size:12.5px;text-align:center;color:var(--muted);margin:0 0 22px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #c9d8f5;border-color:var(--accent)}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;font-size:13.5px}
  .btn:hover{background:#f4f6fa}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.primary:hover{background:#17294a}
  .btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.wide{width:100%;padding:11px}
  .err{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:8px;text-align:center}

  /* app */
  #app{min-height:100vh}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar img{height:26px}
  .topbar .title{font-weight:700;color:var(--navy);margin-right:auto}
  .stage{font-size:12px;padding:3px 9px;border-radius:999px;background:#e8eef9;color:var(--navy);font-weight:700}
  .layout{display:grid;grid-template-columns:370px 1fr;gap:18px;padding:18px;align-items:start}
  .side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:66px;max-height:calc(100vh - 84px);overflow:auto}
  .side h2{font-size:14px;margin:0 0 12px;color:var(--navy)}
  .sec{font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 8px;padding-top:12px;border-top:1px dashed var(--line)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
  .steps{margin:0 0 12px;padding-left:18px;font-size:13px;line-height:1.7}
  .note{font-size:12.5px;line-height:1.6;padding:10px 12px;border-radius:8px;margin-bottom:12px}
  .note.info{background:#eef3fc;color:#1d3c78}
  .note.ok{background:#e7f6ec;color:var(--ok);font-weight:700}
  .note.bad{background:#fdecea;color:var(--danger);font-weight:700}
  .note.warn{background:#fff6dc;color:var(--warn)}
  .radio{display:flex;gap:14px;margin-bottom:8px;font-size:13px}
  .radio label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .padwrap{border:1px dashed #9aa6bb;border-radius:10px;background:#fbfcfe;position:relative}
  .padwrap canvas{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair}
  .padwrap .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a3acbb;font-size:13px;pointer-events:none}
  .padbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .seal-preview{display:flex;align-items:center;gap:12px;margin:8px 0}
  .seal-preview img{width:72px;height:72px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
  .check{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;margin:12px 0}
  .check input{margin-top:3px}
  .preview{display:flex;flex-direction:column;align-items:center;gap:18px;min-width:0}

  /* document */
  .page{width:210mm;min-height:297mm;background:#fff;box-shadow:0 4px 18px rgba(20,30,60,.10);padding:14mm 16mm 18mm;position:relative}
  .doc-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #bfbfbf;padding-bottom:6px;margin-bottom:14px}
  .doc-head img.l{height:30px}.doc-head img.r{height:20px}
  .docno{font-size:8.5pt;color:#666;text-align:right;margin:-8px 0 6px}
  .doc-foot{position:absolute;left:16mm;right:16mm;bottom:8mm;display:flex;justify-content:space-between;font-size:9.5pt;color:#555;border-top:1px solid #bfbfbf;padding-top:4px}
  .doc{font-size:10pt;line-height:1.6;color:#111}
  .doc h1{text-align:center;font-size:19pt;letter-spacing:.35em;margin:6px 0 16px;text-decoration:underline;text-underline-offset:6px}
  .doc h3{font-size:10.5pt;text-align:center;margin:14px 0 6px}
  .doc .label{font-weight:700;margin:8px 0 4px}
  .doc table.party{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:9.5pt}
  .doc table.party td{border:1px solid #333;padding:5px 8px;vertical-align:middle}
  .doc table.party td.h{background:#f2f2f2;text-align:center;font-weight:600;white-space:nowrap}
  .doc .lead{text-align:center;font-weight:700;margin:10px 0 4px}
  .doc .clause p{margin:0 0 4px}
  .doc .pre{white-space:pre-wrap}
  .doc .salary{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:600;margin:4px 0 6px}
  .doc .sign{margin-top:22px}
  .doc .sign .date{text-align:center;font-weight:700;margin:14px 0 18px}
  .doc .party-sign{margin:0 0 22px 0;line-height:2.1}
  .sigspot{position:relative;display:inline-block;padding-right:6px}
  .sigspot img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-height:58px;max-width:150px;pointer-events:none}
  .sigspot img.seal{max-height:62px;max-width:62px;opacity:.92}
  .doc .oath-head{margin:6px 0 14px;line-height:2}
  .doc .indent{padding-left:1.2em}
  .doc .to{text-align:center;font-weight:700;font-size:12pt;margin-top:26px}
  .missing{background:#fff3c4}

  @media (max-width:1100px){
    .layout{grid-template-columns:1fr}
    .side{position:static;max-height:none}
    .preview{overflow-x:auto;align-items:flex-start}
  }

  @page{
    size:A4;margin:13mm 15mm 17mm;
    @bottom-left{content:"www.leekoos.com";font-size:8.5pt;color:#555;font-family:"Malgun Gothic",sans-serif}
    @bottom-center{content:"경기도 안산시 단원구 산단로 325, 스마트스퀘어 344호  ·  " counter(page);font-size:8.5pt;color:#555;font-family:"Malgun Gothic",sans-serif}
    @bottom-right{content:"Tel. 1666-4514";font-size:8.5pt;color:#555;font-family:"Malgun Gothic",sans-serif}
  }
  @media print{
    body{background:#fff}
    .topbar,.side,#login{display:none !important}
    .layout{display:block;padding:0}
    .preview{display:block;gap:0}
    .page{box-shadow:none;margin:0;width:auto;min-height:0;padding:0;page-break-after:always;break-after:page}
    .page:last-child{page-break-after:auto;break-after:auto}
    .doc-foot{display:none}
    .missing{background:none}
    .doc h3,.doc .label{break-after:avoid;page-break-after:avoid}
    .clause,.party-sign{break-inside:avoid;page-break-inside:avoid}
    .page.oath .doc{font-size:9.4pt;line-height:1.5}
    .page.oath .doc h1{margin:2px 0 10px}
    .page.oath .sign .date{margin:8px 0 8px}
    .page.oath .to{margin-top:12px}
  }

  /* v3: home + mobile */
  #home{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .home-card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px 24px;box-shadow:0 10px 30px rgba(20,30,60,.08);text-align:center}
  .home-card img{height:40px;margin-bottom:12px}
  .home-card h1{font-size:20px;color:var(--navy);margin:0 0 6px}
  .home-card p{font-size:13px;color:var(--muted);margin:0 0 22px;line-height:1.6}
  .home-btn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:12px}
  .home-btn b{display:block;font-size:16px;color:var(--navy);margin-bottom:3px}
  .home-btn span{font-size:12.5px;color:var(--muted)}
  .home-btn.main{border:2px solid var(--ok);background:#f2fbf5}
  .home-btn.main b{color:var(--ok)}
  .linkbtn{display:block;text-align:center;text-decoration:none;margin-top:10px}
  .back{font-size:12.5px}
  @media (max-width:1100px){
    .layout{padding:10px;gap:12px}
    .layout.signmode .side{order:2}
    .layout.signmode .preview{order:1}
    .topbar{padding:8px 10px}
  }
  @media screen and (max-width:860px){
    .page{width:100%;min-height:0;padding:16px 14px 46px;border-radius:10px}
    .doc{font-size:13.5px;line-height:1.65}
    .doc h1{font-size:21px;letter-spacing:.2em;margin:4px 0 14px}
    .doc h3{font-size:14px}
    .doc table.party{font-size:12px}
    .doc table.party td{padding:5px 5px}
    .doc-head img.l{height:24px}.doc-head img.r{height:16px}
    .doc-foot{left:14px;right:14px;bottom:10px;font-size:10px}
    .doc-foot span:nth-child(2){display:none}
    .preview{overflow-x:visible}
    .topbar .title{font-size:14px}
  }
  .msg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;background:#fff}
  .msg.rec{border:2px solid var(--ok);background:#f6fcf8}
  .msg-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .msg-h b{font-size:13px;color:var(--navy);margin-right:auto}
  .msg-h .tag{font-size:11px;font-weight:700;color:#fff;background:var(--ok);border-radius:999px;padding:2px 8px}
  .msg textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.55;background:#fafbfd;resize:vertical;color:var(--ink)}
  .btn.copy{padding:5px 12px;font-size:12.5px}
  .btn.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.copy.warnbtn{background:var(--danger);border-color:var(--danger);color:#fff}
  .stagebox{font-size:12.5px;padding:8px 10px;border-radius:8px;background:#eef3fc;color:#1d3c78;margin:10px 0}
  @media print{ .page{zoom:1 !important} #home,#dash{display:none !important} }
  /* v4: dashboard */
  .dash-wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  .dcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .dcard h2{font-size:16px;color:var(--navy);margin:0 0 10px}
  .dcard.connect{border:2px solid var(--accent);background:#f5f8fe}
  .dcard.connect p{font-size:13px;line-height:1.7;margin:0 0 12px;color:var(--ink)}
  .dsum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .dsum div{flex:1 1 140px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .dsum b{display:block;font-size:22px;color:var(--navy)}
  .dsum span{font-size:12px;color:var(--muted)}
  .dsum .hot{border:2px solid var(--ok)} .dsum .hot b{color:var(--ok)}
  table.dt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
  table.dt th{background:#f3f5f9;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:12px}
  table.dt td{padding:10px;border-bottom:1px solid #eceff4;vertical-align:middle}
  table.dt tr:last-child td{border-bottom:0}
  table.dt td.act{text-align:right;white-space:nowrap}
  table.dt td.act .btn{padding:6px 11px;font-size:12.5px;margin-left:4px}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .pill.s0{background:#fff6dc;color:var(--warn)} .pill.s1{background:#eef3fc;color:#1d3c78}
  .pill.s2{background:#e7f6ec;color:var(--ok)} .pill.s3{background:#eceff4;color:var(--muted)} .pill.bad{background:#fdecea;color:var(--danger)}
  .todo{font-size:12.5px;color:var(--ink)} .todo small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .path{font-family:Consolas,monospace;font-size:12px;background:#f3f5f9;border:1px solid var(--line);border-radius:6px;padding:6px 8px;word-break:break-all;margin:6px 0 10px}
  .dsec{font-size:13px;font-weight:700;color:var(--navy);margin:18px 0 8px}
  @media (max-width:860px){ table.dt thead{display:none} table.dt tr{display:block;border-bottom:1px solid var(--line);padding:6px 0} table.dt td{display:block;border:0;padding:4px 12px} table.dt td.act{text-align:left} }
</style>
</head>

    <h1>리쿠스 근로계약서</h1>
    <div id="homeMain">
    <p>받은 계약서 파일을 열어 확인·서명하거나,<br>담당자는 로그인해 업무 현황판을 엽니다.</p>
    <button class="home-btn main" id="btnOpen" type="button"><b>계약서 파일 열기</b><span>대표 확인서명 · 입사자 서명</span></button>

  function makePad(canvas, onChange){
    var ctx=canvas.getContext("2d"), drawing=false, empty=true, last=null;
    function fit(){
      var r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
      canvas.width=Math.max(1,Math.round(r.width*dpr)); canvas.height=Math.max(1,Math.round(r.height*dpr));
      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#111";
      empty=true; onChange&&onChange(empty);
    }
    function pos(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
    canvas.addEventListener("pointerdown",function(e){ drawing=true; last=pos(e); canvas.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,Math.PI*2); ctx.fillStyle="#111"; ctx.fill(); if(empty){empty=false; onChange&&onChange(empty);} });
    canvas.addEventListener("pointermove",function(e){ if(!drawing) return; var p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
    ["pointerup","pointercancel","pointerleave"].forEach(function(t){ canvas.addEventListener(t,function(){ drawing=false; }); });
    setTimeout(fit,0);
    return {
      clear:function(){ fit(); },
      isEmpty:function(){ return empty; },
      toDataURL:function(){
        var w=canvas.width,h=canvas.height,img=ctx.getImageData(0,0,w,h).data,x0=w,y0=h,x1=0,y1=0;
        for(var y=0;y<h;y++) for(var x=0;x<w;x++){ if(img[(y*w+x)*4+3]>0){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
        if(x1<x0) return "";
        var pad=6; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
        var tw=x1-x0+1, th=y1-y0+1, scale=Math.min(1, 360/tw), c=document.createElement("canvas");
        c.width=Math.round(tw*scale); c.height=Math.round(th*scale);
        c.getContext("2d").drawImage(canvas,x0,y0,tw,th,0,0,c.width,c.height);
        return c.toDataURL("image/png");
      }
    };
  }
  function padHTML(id, placeholder){
    return '<div class="padwrap"><canvas id="'+id+'"></canvas><div class="ph" id="'+id+'_ph">'+placeholder+'</div></div>'+
           '<div class="padbar"><span class="hint">마우스나 손가락으로 서명</span><button class="btn" type="button" id="'+id+'_clear">지우기</button></div>';
  }
  function bindPad(id, onChange){
    var pad=makePad($(id), function(empty){ $(id+"_ph").style.display=empty?"flex":"none"; onChange&&onChange(empty); });
    $(id+"_clear").addEventListener("click", function(){ pad.clear(); });
    return pad;
  }

  function clause2(d,f){
    var date=f(fmtDate(d.date),"(계약일)"), m=esc(d.months||"3");
    if(d.type==="renew") return '<p>"을"은 '+date+'로부터 본 근로계약 사항이 적용 된다.</p>';
    var evalItems='   &lt;평가 항목 및 배점&gt;\n   - 업무 수행 능력 및 적극성 (40점)\n   - 출결 상황 (결근 1회당 5점 감점, 지각 3회당 5점 감점) (20점)\n   - 조직 적응도 및 협업 능력 (20점)\n   - 직무 전문성 및 발전 가능성 (20점)\n';
    var excl='   - 무단결근 2회 이상 또는 월 누적 결근 5일 이상\n   - 중대한 업무상 과실 또는 고의적 업무 방해 행위\n   - 회사 규정 위반으로 징계 처분을 받은 경우';
    if(d.type==="intern") return P('"을"은 '+date+'로부터 초기 '+m+'개월은 인턴(계약직) 조건으로 계약되며,\n\n1. 이후 평가를 통해 정규직 전환 여부를 결정한다.\n2. "갑"은 인턴 기간 종료 1주일 전까지 다음의 객관적 평가를 실시한다:\n'+evalItems+'   평가 결과 70점 이상 득점 시 정규직 전환 대상이 되며,\n   최종 전환 여부는 회사의 경영 상황, 인력 수급 계획 등을 고려하여 결정한다.\n3. "갑"은 평가 결과를 "을"에게 서면으로 통지하며, 전환이 불가능한 경우\n   그 사유를 구체적으로 명시한다.\n4. 인턴 기간 중 다음의 사유가 발생한 경우 정규직 전환 대상에서 제외된다:\n'+excl);
    return P('"을"은 '+date+'로부터 기간의 정함이 없는 근로계약(정규직)으로 계약하며, 최초 '+m+'개월은 수습기간으로 한다.\n\n1. 수습기간 중 임금 및 근로조건은 본 계약과 동일하게 적용하며, 수습기간은 근속기간에 포함한다.\n2. "갑"은 수습기간 종료 1주일 전까지 다음의 객관적 평가를 실시한다:\n'+evalItems+'   평가 결과 70점 이상 득점 시 본채용으로 확정한다.\n3. 평가 결과 70점 미만이거나 아래 사유가 있는 경우 "갑"은 합리적 사유를 들어 본채용을 거부할 수 있으며,\n   그 사유를 "을"에게 서면으로 통지한다.\n'+excl);
  }

      C('제5조【근로시간】',P('근무시간: 주 5일(월~금), 1일 8시간, 주 40시간 (법정 근로시간 기준)\n점심시간: '+f(d.lunch)+' (1시간 휴게)\n업무 특성상 연장, 야간, 휴일근무가 발생할 수 있으며, 주 52시간 이내를 원칙으로 한다.\n[1일 6시간(주30시간)단축 근무 조건 근무자는 별도 사항 적용]'))+
      C('제6조의1【휴일․휴가】',P('“갑”의 제규정(리쿠스 사내 규정)에 따른다.\n1. "을"은 연차유급휴가를 사용하고자 할 때 사전에 "갑"에게 통보하여야 한다.\n   원활한 업무 운영을 위해 가능한 7일 전까지 신청할 것을 권장한다.\n2. "갑"은 "을"이 청구한 시기에 휴가를 주어야 한다. 다만, 다음의 경우\n   "갑"은 시기변경권을 행사할 수 있다:\n   - 해당 시기에 휴가를 주는 것이 사업 운영에 막대한 지장이 있는 경우\n   - 중요 프로젝트 마감일 또는 필수 업무 수행 기간\n   - 동일 부서 다수 인원이 동시 휴가로 업무 공백이 우려되는 경우\n3. "갑"이 시기변경권을 행사하는 경우 그 사유를 "을"에게 구체적으로\n   통지하고, 대체 사용 시기를 협의하여야 한다.\n4. "을"이 연속 3일 이상의 휴가를 사용하려는 경우, 업무 인수인계 계획을\n   함께 제출하여야 한다.'))+

      C('제7조【보 수】','<p>사업자가 지급하는 보수는 다음과 같다.</p><div class="salary">연봉 : 금 '+f(hangulAmount(d.salary),"(연봉)")+' 원 ( ₩ '+f(comma(d.salary))+' 원 )</div>'+
        P('1. (식대, 차량유지비, 직무수당, 근무수당) 포함.\n2. 지급일 : 매월 ['+f(d.payday,"  ")+'일] (휴일일 경우에는 전일 지급)\n3. 지급방법 : “을”의 은행계좌에 송금\n4. 연/월차 사용이 아닌 결근 시 주휴수당은 지급되지 않는다.\n5. 연봉에는 다음 항목이 포함된다:\n   - 기본급\n   - 연장근로수당 (월 20시간 기준)\n   - 야간근로수당 (월 10시간 기준)\n   - 휴일근로수당 (월 8시간 기준)\n   - 직무수당, 식대 등 고정수당'))+
      C('제8조【근태사항】',P('다음 각 호의 사유가 있는 경우에는 취업규칙상 관련 규정을 적용하여 연봉을 지급한다.\n- 휴직, 결근, 감급, 정직'))+
      C('제9조【퇴직절차】',P('1. "을"은 퇴직하고자 할 경우 사직희망일 30일 전에 사직원을 제출하여야 하며,\n   업무인수인계 및 회사 자산 반납을 완료하여야 한다.\n2. "을"이 제1항의 통보 기간을 준수하지 않아 "갑"에게 실제 손해가 발생한 경우,\n   "을"은 그 손해에 대해 배상할 책임이 있다. 단, 손해액은 "갑"이 구체적으로\n   입증하여야 한다.\n3. "을"이 긴급한 개인 사정으로 즉시 퇴사하는 경우 근로일 기준 일할 계산된\n   금액을 지급하되, 미완료 인수인계 업무로 인한 회사의 손해는 별도 협의한다.'))+
      C('제10조【비밀준수 의무】',P('1. “을”은 계약기간 동안 본인이 직접 또는 간접적으로 관련되어 취득한 회사의 영업비밀 보호를 위하여 신의성실의 원칙에 입각하여 최선을 다하여야 하며, 재직 중 또는 퇴직 후에 라도 “을”이 날인하여 “갑”에게 제출한 “비밀유지서약서”의 비밀유지의무 사항을 회사의 사전 허가 없이 사용, 복제, 누설해서는 아니된다.\n2. 전항을 위반하여 “을”의 고의 또는 과실로 “갑”에게 손실을 입힌 경우, 부정경쟁방지 및 영업 비밀보호에 관한 법률 등 관련 조항 또는 회사 내규에 의해 그 손실액을 배상하여야 한다. 핵심 내용에 대한 유출의 경우 해당 사업내용 전체에 대한 제반 비용을 청구 할 수 있다.'))+
      C('제11조【계약해지 사유】',P('1. 계속하여 2일 이상 또는 월간 3일 이상 결근한경우\n2. 취업규칙 또는 “갑”의 정당한 업무명령을 위반 또는 사내 업무환경 훼손등의 사유로 해고 결정이 있는 경우\n3. 이력, 경력을 위조하여 허위로 입사하였을 경우\n4. “을”의 일신상의 사유로 계속적 근로가 불가능한 경우\n5. 기타 사회상규를 위반하여 계속적으로 근로계약을 유지할 수 없다고 판단된 경우\n6. 최근 6개월중 3회 이상 당일 통보 결근이 반복되는 경우 경영지원부의 검토후 계약 해지\n7. 반복적 근무 태만 및 태도 불성실의 경우 2회 경고후 3회 발생시 계약 해지\n8. 계약 위반, 무단결근, 내부 질서 위반, 이력 위조 등은 계약 해지 사유가 된다.'))+
      C('제12조【손해배상】','<p>“을”의 귀책사유로 인해 계약기간 중 또는 계약해지 후 “갑”에게 중대한 손해를 입힐 경우 "갑"은 "을"에게 회사의 손해에 대하여 배상을 청구 할 수 있으며, 규격화된 손해의 경우 일단 배상하고 "을"의 이의제기시 법적절차를 통해 확실하게 하도록 한다. 이때 손해는 잠정적인 손해를 모두 포함하며, 매출에 영향을 미치는 경우 해당 금액 만큼에 대한 책임 여지에 따라 배상을 청구 할 수 있다.</p>')+
      C('제13조【정보보호 및 사내 장비,기구 사용】','<p>사내 전산 장비 및 일반 기구물 기타 장비, 시스템은 업무 목적에 한해 사용 가능하며, 외부 반출 시 회사의 승인을 받아야 한다. 개인정보는 외부 유출하거나 무단 저장할 수 없다.</p>')+
      C('제14조【업무성과물 및 지식재산권 귀속】','<p>근로자가 재직 중 창출한 문서, 디자인, 기획물, 시스템, 기술자료 등 모든 성과물의 소유권은 회사에 귀속된다. 특히 회로도, PCB 아트웍, 펌웨어 소스코드, 설계도면 등은 편집 가능한 원본 파일로 회사가 지정한 저장소(NAS 등)에 수시로 보관하여야 하며, 퇴직 시 원본 일체를 인계하여야 한다.</p>')+
      C('제15조【기타사항】',P('1. 기타 본 계약서에 명시되지 않은 사항은 “갑”의 취업규칙 등 제 규정과 기타 노동관계법령이 정하는 바에 따른다.\n2. 본 계약은 “갑”과 “을”의 서명 또는 기명날인(전자서명을 포함한다)으로 효력이 발생된다.\n3. 본 계약은 반드시 서면의 의하여만 변경될 수 있다.'))+
      '<div class="sign">'+P('위와 같이 연봉 및 근로계약을 체결하였음을 확인하며, 본 계약서 2통을 작성하여, 각각 서명 날인 후\n“갑”과 “을”이 1통씩 보관한다.')+
        '<div class="date">'+f(fmtDate(d.date),"(계약일)")+'</div>'+
        '<div class="party-sign"><b>“갑”</b><br>사업자번호 : '+COMPANY.biz+'<br>사업체명 : &nbsp;㈜리쿠스<br>대표이사 : '+f(d.ceo)+' &nbsp;&nbsp;<span class="sigspot">(인)'+sigImg(cs,csClass)+'</span>'+
          (opt.ceoAt? '<br><span style="font-size:8.5pt;color:#666">전자서명 일시 : '+esc(fmtStamp(opt.ceoAt))+'</span>' : '')+'</div>'+
        '<div class="party-sign"><b>“을”</b><br>생년월일 : '+f(fmtDate(d.birth))+'<br>성명 : '+f(d.name)+' &nbsp;&nbsp;<span class="sigspot">(서명 또는 인)'+sigImg(es)+'</span>'+
          (opt.signedAt? '<br><span style="font-size:8.5pt;color:#666">전자서명 일시 : '+esc(fmtStamp(opt.signedAt))+'</span>' : '')+'</div>'+
      '</div></div>';

    var p2=head()+docno+'<div class="doc">'+
      '<h1 style="letter-spacing:.12em">비밀유지 및 겸업금지 서약서</h1>'+
      '<div class="oath-head">■ 성 명 : '+f(d.name)+'<br>■ 생년월일 : '+f(fmtDate(d.birth))+'<br>■ 주소 : '+f(d.addr)+'<br>■ 소속 및 직책 : '+f(d.dept)+'</div>'+
      '<p>상기본인(이하 \'갑\'이라 함)은 '+f(fmtDate(d.date),"(계약일)")+' (주)리쿠스(이하 ‘회사’라 함)와 근로계약을 체결하여 업무를 수행하고 있음을 확인하며 아래의 내용을 준수할 것을 서약한다.</p>'+
      P('\n1. "을"은 재직 중 및 퇴직 후에도 다음 정보를 외부에 누설하거나\n   이용해서는 아니 된다:\n   - 고객 명단, 거래처 정보, 단가 정보\n   - 미공개 기술자료, 영업전략, 사업계획\n   - 회사가 비밀로 지정한 내부 정보\n\n2. 이에 갑은 아래와 같이 회사 기밀정보의 보호 및 퇴직 후 겸업금지에 관하여 다음의 사항에 대하여 동의한다.\n')+
      P('(1) 본 서약서는 갑이 회사의 업무수행 중 회사로부터 제공받은 독점적인 정보에 적용되며 존재형태와\n    무관하게 회사의 중요 기밀사항, 제품과 서비스, 마케팅정보 또는 고객정보, 사업계획 및 영업비밀,\n    기타 연구 및 개발 관련 사항 등을 포함한다.\n')+
      P('(2) 갑은 이하의 내용에 동의한다.\n① 회사의 재직 중 내지 퇴직 후에도 회사의 기밀정보를 제 3자에게 공개하지 아니한다.\n② 재직 중에는 개인적 사유로 인한 회사 업무와 겸업하지 아니한다. (겸업 기간동안의 급여에 대한 환수약속)\n③ 회사를 퇴직한 후 1년 동안 회사의 승낙 없이 아래의 행위를 하지 아니한다.')+
      '<div class="indent">'+P('1.  회사의 제품 및 서비스와 경쟁적인 관계에 있는 개인, 기업, 조합 또는 기타 사업 체에 취업 또는 경영 등의 방식으로 직·간접적으로 종사하거나 대리, 고문, 상담역, 기타 협력적 지위에서 지원하는 일\n2.  회사에 근무하고 있거나 본 서약서상의 의무를 부담하고 있는 직원을 경쟁회사 또는 사업에 권유하거나 유인하는 일\n3.  회사가 영업을 하고 있는 사업영역에 직접적, 다른 회사의 지분소유를 통한 간접적으로 회사의 상호·상표와 동일 또는 유사한 상호·상표를 사용하는 일')+'</div>'+
      P('④ 회사의 전산 장비상의 데이터를 사적으로 보관하지 않으며 사외로 유출하지 아니한다.\n⑤ 회사와 관련된 업무를 수행하는 경우에만 사내 데이터 처리시설을 사용하며 정보자산 의 외부 발신시 회사의 통제절차를 준수한다.\n⑥ 갑이 회사의 퇴사절차에 의하여 회사의 업무수행을 중단하는 경우 갑은 회사의 요구에 따라 모든 유형의 회사의 비밀정보가 포함된 수령물과 그 사본을 반환하고, 회사내에 서 갑에 의해 작성된 모든 유·무형물을 삭제 또는 반환하고 본 규정을 충족하였음을 서면으로 보증하여야 한다.\n')+
      '<p><b>갑은 상기 사항을 숙지하여 이를 성실히 준수하며 만일 위 사항을 위반할 경우 부정경쟁방지법에 의한 책임은 물론 현행법 및 갑과 회사와의 약정에 의거한 민․형사상의 모든 책임을 지며 분쟁이 발생시 소송은 회사의 소재지 관할 법원으로 한다.</b></p>'+
      '<div class="sign"><div class="date">'+f(fmtDate(d.date),"(계약일)")+'</div>'+
      '<p style="text-align:right">서 약 인 : '+f(d.name)+' &nbsp;&nbsp;<span class="sigspot">(인)'+sigImg(es)+'</span></p></div>'+
      '<div class="to">(주)리쿠스 대표이사 귀하</div></div>';

    $("preview").innerHTML='<div class="page">'+p1+foot("근로계약서")+'</div><div class="page oath">'+p2+foot("서약서")+'</div>';
    fitPages();
  }


  function doPrint(name, tag){
    var old=document.title; document.title="근로계약서_"+safeName(name)+"_"+(tag||"서명완료");
    window.print(); setTimeout(function(){document.title=old;},500);
  }
  function fitPages(){
    var pv=$("preview"); if(!pv) return;
    var w=pv.clientWidth, z=window.innerWidth<=860? 1 : Math.min(1,(w-4)/794);
    Array.prototype.forEach.call(pv.querySelectorAll(".page"),function(p){ p.style.zoom = z<1 ? String(z) : ""; });
  }
  window.addEventListener("resize", fitPages);
  function show(id){ ["home","login","app","dash"].forEach(function(s){ $(s).classList.toggle("hidden", s!==id); }); window.scrollTo(0,0); }
  function setTop(title, stage, buttonsHTML){ $("topTitle").textContent=title; $("stageTag").textContent=stage; $("topButtons").innerHTML=buttonsHTML||""; }
  function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf),function(b){ return (b<16?"0":"")+b.toString(16); }).join(""); }
  function unhex(h){ var a=new Uint8Array(h.length/2); for(var i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16); return a; }
  function checkCred(id,pw){
    if(!(window.crypto&&crypto.subtle)) return Promise.reject(new Error("no-subtle"));
    var enc=new TextEncoder();
    return crypto.subtle.importKey("raw",enc.encode(String(id).trim()+":"+pw),"PBKDF2",false,["deriveBits"]).then(function(k){
      return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:unhex(CRED.salt),iterations:CRED.iter},k,256);
    }).then(function(bits){ return hex(bits)===CRED.hash; });
  }
  function login(id,pw,errId,pwId,ok){
    $(errId).textContent="확인 중…";
    checkCred(id,pw).then(function(good){
      if(!good){ $(errId).textContent="아이디 또는 비밀번호가 올바르지 않습니다."; $(pwId).value=""; return; }
      $(errId).textContent=""; $(pwId).value=""; ok(pw);
    }, function(){ $(errId).textContent="이 브라우저에서는 로그인할 수 없습니다. 최신 Chrome·Safari·Edge로 열어 주세요."; });
  }
  function goodUrl(u){ return /^https?:\/\/[^\s"'<>]+$/i.test(u||""); }
  function uploadButton(P){ return goodUrl(P.upload)? '<a class="btn primary linkbtn" href="'+esc(P.upload)+'" target="_blank" rel="noopener">업로드 페이지 열기</a>' : ''; }
  function fileName(P, step){ return "근로계약서_"+safeName(P.data.name)+"_"+step+".lkc"; }
  function save(P, step){ download(fileName(P,step), JSON.stringify(P)); }
  function sigs(P){ return {company:P.ceo?(P.ceo.sig||ceoMark(P)):"", companyKind:"", employee:P.employee?P.employee.sig:""}; }
  var MARKS={};
  function ceoMark(P){ var n=P.data.ceo||""; if(MARKS[n]) return MARKS[n];
    var c=document.createElement("canvas"); c.width=360; c.height=120; var g=c.getContext("2d");
    g.strokeStyle="#c0392b"; g.lineWidth=5; g.strokeRect(6,6,348,108); g.fillStyle="#c0392b"; g.textAlign="center";
    g.font="bold 34px sans-serif"; g.fillText("전자서명 완료",180,58); g.font="24px sans-serif"; g.fillText("대표이사 "+n,180,96);
    return (MARKS[n]=c.toDataURL("image/png")); }
  function opts(P){ return {strict:true, docNo:P.docNo, ceoAt:P.ceo&&P.ceo.signedAt, signedAt:P.employee&&P.employee.signedAt}; }
  function setLayout(sign){ $("layout").classList.toggle("signmode", !!sign); }
  function homeBtn(){ return SESSION? '<button class="btn back" id="btnHome" type="button">← 현황판으로</button>' : '<button class="btn back" id="btnHome" type="button">처음으로</button>'; }
  function bindHome(){ var b=$("btnHome"); if(b) b.addEventListener("click", function(){ if(SESSION) dashMode(); else location.reload(); }); }

  /* ======================= HOME ======================= */
  function home(){
    show("home");
    $("btnDash").onclick=function(){ show("login"); $("uid").focus(); };
    var hm=/[#&]c=([A-Za-z0-9_-]+)/.exec(location.hash);
    if(hm){
      $("homeMain").classList.add("hidden"); $("codeBox").classList.remove("hidden"); setTimeout(function(){ $("codeIn").focus(); },50);
      $("codeBox").onsubmit=function(e){
        e.preventDefault(); var code=$("codeIn").value;
        if(normCode(code).length<8){ $("homeErr").textContent="비밀번호 8자리를 입력해 주세요. (문자로 따로 받은 비밀번호)"; return; }
        $("homeErr").textContent="확인 중…"; $("codeGo").disabled=true;
        openLink(hm[1], code).then(function(P){
          $("codeGo").disabled=false;
          if(!P||P.app!=="LK-CONTRACT"||!P.data){ $("homeErr").textContent="계약서 정보를 읽지 못했습니다. 담당자에게 문의해 주세요."; return; }
          if(P.exp && isoDay(new Date())>P.exp){ $("homeErr").textContent="링크 유효기간("+P.exp+")이 지났습니다. 담당자에게 새 링크를 요청해 주세요."; return; }
          $("homeErr").textContent="";
          if(P.stage==="draft") ceoMode(P); else if(P.stage==="ceo_signed") employeeMode(P);
          else $("homeErr").textContent="파일 상태를 알 수 없습니다. 담당자에게 문의해 주세요.";
        }, function(err){
          $("codeGo").disabled=false;
          $("homeErr").textContent = (err&&err.message==="no-inflate") ? "휴대폰 운영체제(브라우저)가 오래되어 열 수 없습니다. 업데이트 후 다시 열거나 담당자에게 문의해 주세요."
            : "비밀번호가 맞지 않습니다. 문자로 받은 비밀번호를 다시 확인해 주세요.";
          $("codeIn").select();
        });
      };
    }
    $("btnOpen").onclick=function(){ $("homeErr").textContent=""; $("fileIn").value=""; $("fileIn").click(); };
    $("fileIn").onchange=function(){
      var f=this.files&&this.files[0]; if(!f) return;
      var rd=new FileReader();
      rd.onload=function(){
        var P=null; try{ P=JSON.parse(rd.result); }catch(e){}
        if(!P || P.app!=="LK-CONTRACT" || !P.data){ $("homeErr").textContent="리쿠스 근로계약서 파일(.lkc)이 아닙니다. 받은 파일을 다시 선택해 주세요."; return; }
        if(P.stage==="draft") ceoMode(P);
        else if(P.stage==="ceo_signed") employeeMode(P);
        else if(P.stage==="signed" && P.employee) reviewMode(P);
        else $("homeErr").textContent="파일 상태를 알 수 없습니다. 담당자에게 문의해 주세요.";
      };
      rd.onerror=function(){ $("homeErr").textContent="파일을 읽지 못했습니다. 다시 시도해 주세요."; };
      rd.readAsText(f);
    };
    $("loginBack").onclick=function(){ show("home"); };
    $("loginForm").onsubmit=function(e){
      e.preventDefault();
      login($("uid").value,$("upw").value,"loginErr","upw",function(pw){ SESSION={pw:pw}; dashMode(); });
    };
  }

      '<button class="btn go" id="btnExport" type="button">대표 서명요청 파일 만들기</button> '+homeBtn());
    $("side").innerHTML=
      '<h2>1. 근로자 정보</h2>'+

  /* ======================= 안내 문자 자동 생성 ======================= */
  var WD=["일","월","화","수","목","금","토"];
  function isoDay(dt){ function z(n){return (n<10?"0":"")+n;} return dt.getFullYear()+"-"+z(dt.getMonth()+1)+"-"+z(dt.getDate()); }
  function md(v){ if(!v) return ""; var p=v.split("-"), dt=new Date(+p[0],+p[1]-1,+p[2]); return (+p[1])+"월 "+(+p[2])+"일("+WD[dt.getDay()]+")"; }
  function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n); return isoDay(d); }
  function pageUrlDefault(){
    var saved=lsGet("lk_page_url"); if(saved) return saved;
    if(/^https?:$/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname)) return location.origin+location.pathname.replace(/index\.html?$/i,"");
    return "https://btypenine.github.io/leekoos-contract/";
  }
  function copyText(text, btn){
    function ok(){ btn.textContent="복사됨 ✓"; btn.classList.add("done"); setTimeout(function(){ btn.textContent="복사"; btn.classList.remove("done"); },1600); }
    function fallback(){ var t=document.createElement("textarea"); t.value=text; t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select();
      try{ document.execCommand("copy"); ok(); }catch(e){ alert("복사가 안 되면 글상자를 길게 눌러 전체 선택 후 복사해 주세요."); } t.remove(); }
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(ok, fallback); } else fallback();
  }

  /* ---------- 서명 링크 (계약 내용을 비밀번호로 암호화해 링크 #뒤에 담음 — 서버로 전송되지 않음) ---------- */
  var CODE_ABC="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function newCode(){ var a=new Uint8Array(8); crypto.getRandomValues(a); var s=""; for(var i=0;i<8;i++){ s+=CODE_ABC.charAt(a[i]%32); if(i===3) s+="-"; } return s; }
  function normCode(c){ return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
  function b64u(bytes){ var s=""; for(var i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  function unb64u(t){ t=t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4) t+="="; var s=atob(t), a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
  async function zip(bytes){ if(typeof CompressionStream==="undefined") return null; return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()); }
  async function unzip(bytes){ if(typeof DecompressionStream==="undefined") throw new Error("no-inflate"); return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()); }
  async function codeKey(code,salt){ var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(normCode(code)),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:150000},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]); }
  async function sealLink(obj, code){
    var raw=new TextEncoder().encode(JSON.stringify(obj)), z=await zip(raw), body=z||raw;
    var salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)), key=await codeKey(code,salt);
    var ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,body));
    var out=new Uint8Array(30+ct.length); out[0]=1; out[1]=z?1:0; out.set(salt,2); out.set(iv,18); out.set(ct,30); return b64u(out); }
  async function openLink(token, code){
    var a=unb64u(token), key=await codeKey(code,a.slice(2,18));
    var pt=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:a.slice(18,30)},key,a.slice(30)));
    if(a[1]===1) pt=await unzip(pt);
    return JSON.parse(new TextDecoder().decode(pt)); }
  function linkPayload(P, exp){
    var o={app:P.app,v:P.v,id:P.id,stage:P.stage,data:P.data,upload:P.upload,createdAt:P.createdAt,exp:exp||""};
    if(P.stage==="ceo_signed"){ o.ceo={signedAt:P.ceo.signedAt}; o.mac=P.mac; o.docNo=P.docNo; }   // 대표 서명 이미지는 링크에 넣지 않음 (회수 시 01_진행 원본과 합침)

  function kvGet(k){ return idb().then(function(db){ return new Promise(function(res){ var q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=function(){ res(q.result||null); }; q.onerror=function(){ res(null); }; }); }).catch(function(){ return null; }); }
  function kvSet(k,v){ return idb().then(function(db){ return new Promise(function(res){ var t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=function(){ res(true); }; t.onerror=function(){ res(false); }; }); }).catch(function(){ return false; }); }
  async function useRoot(h){

  async function fsWrite(dir,name,text){ var d=await sub(dir); var fh=await d.getFileHandle(name,{create:true}); var w=await fh.createWritable(); await w.write(text); await w.close(); }
  async function fsRemove(dir,name){ var d=await sub(dir); try{ await d.removeEntry(name); }catch(e){ if(!e||e.name!=="NotFoundError") throw e; } }
  async function readDir(dh, dir, depth, out){
    for await (var ent of dh.entries()){
      var name=ent[0], h=ent[1];
      if(name.charAt(0)==="." || name.charAt(0)==="#" || name==="@eaDir") continue;
      if(h.kind==="directory"){ if(depth>0) await readDir(h, dir, depth-1, out); continue; }
      var f=await h.getFile(); if(f.size>3e6) continue;
      var P=null; try{ P=JSON.parse(await f.text()); }catch(e){}
      out.push({dir:dir, name:name, dh:dh, P:(P&&P.app==="LK-CONTRACT"&&P.data)?P:null, mtime:f.lastModified});
    }
    return out;
  }
  async function fsList(dir, depth){ return readDir(await sub(dir), dir, depth||0, []); }

  // 02_회수에 들어온 파일을 단계에 맞게 01_진행으로 옮기고 이전 단계 파일을 정리
  async function sync(){
    var log=[];
    var run=await fsList(DIRS.run), back=await fsList(DIRS.back,2), done=await fsList(DIRS.done);
    var cur={}, arch={};
    done.forEach(function(e){ if(e.P) arch[keyOf(e.P)]=e; });
    run.forEach(function(e){ if(!e.P) return; var k=keyOf(e.P); if(!cur[k] || RANK[e.P.stage]>RANK[cur[k].P.stage]) cur[k]=e; });
    for (var i=0;i<back.length;i++){
      var e=back[i];
      if(!e.P){ if(!/\.(tmp|part|crdownload)$/i.test(e.name)) log.push("⚠ 02_회수의 '"+e.name+"' 은(는) 계약서 파일이 아니어서 건너뛰었습니다."); continue; }
      var k=keyOf(e.P), have=cur[k];
      if(arch[k] || e.P.stage==="draft" || (have && RANK[e.P.stage]<=RANK[have.P.stage])){ await e.dh.removeEntry(e.name).catch(function(){}); continue; }
      if(e.P.stage==="signed" && e.P.ceo && !e.P.ceo.sig){
        if(!(have && have.P.ceo && have.P.ceo.sig)){ log.push("⚠ "+e.P.data.name+" 님 서명 완료본을 받았지만 01_진행에 대표 서명본이 없어 처리하지 못했습니다. 대표이사에게 문의하세요."); continue; }
        e.P.ceo.sig=have.P.ceo.sig;
      }
      var nm=fileName(e.P, STEPNAME[e.P.stage]);
      await fsWrite(DIRS.run, nm, JSON.stringify(e.P));
      await e.dh.removeEntry(e.name).catch(function(){});
      cur[k]={dir:DIRS.run, name:nm, P:e.P, mtime:Date.now()};
      log.push("✓ "+e.P.data.name+" 님 "+(e.P.stage==="ceo_signed"?"대표 서명본":"입사자 서명 완료본")+"을 회수해 01_진행으로 옮겼습니다.");
    }
    for (i=0;i<run.length;i++){
      var r=run[i]; if(!r.P) continue;
      var k2=keyOf(r.P), c=cur[k2];
      if(arch[k2] || (c && c.name!==r.name)) await fsRemove(DIRS.run, r.name);
    }
    Object.keys(arch).forEach(function(k){ delete cur[k]; });
    var act=Object.keys(cur).map(function(k){ return cur[k]; });
    act.sort(function(a,b){ return String(b.P.createdAt).localeCompare(String(a.P.createdAt)); });
    var ar=done.filter(function(e){ return e.P; }).sort(function(a,b){ return b.mtime-a.mtime; });
    return {act:act, arch:ar, log:log};
  }

    $("dConnect").innerHTML='<div class="dcard connect"><h2>'+(st==="prompt"?"인사 폴더 사용 허용":"인사 폴더 연결 (처음 한 번)")+'</h2>'+
      (st==="prompt"
        ? '<p>보안을 위해 브라우저를 다시 열면 폴더 사용 허용을 한 번 더 묻습니다. 아래 버튼을 누르고 <b>[파일 수정 허용]</b>을 선택하세요.</p><button class="btn primary" id="dGrant" type="button">인사 폴더 사용 허용</button> <button class="btn" id="dPick" type="button">다른 폴더 선택</button>'
        : '<p>아래 버튼을 누르고 <b>Z:\\00_0 Leekoos\\인사</b> 폴더를 선택한 뒤 <b>[폴더 선택] → [파일 수정 허용]</b>을 누르세요.<br>그 안에 <b>근로계약서\\01_진행 · 02_회수 · 03_최종보관</b> 폴더가 자동으로 만들어지고, 이후 파일 저장·회수·이동·보관은 이 현황판이 알아서 합니다.</p><button class="btn primary" id="dPick" type="button">인사 폴더 연결</button>')+
      '<div class="err" id="dErr" style="text-align:left"></div></div>';
    var g=$("dGrant"); if(g) g.onclick=function(){ reconnect(true).then(function(s){ if(s==="ok") connected(); else $("dErr").textContent="허용되지 않았습니다. 다시 눌러 [파일 수정 허용]을 선택해 주세요."; }, function(e){ $("dErr").textContent=String(e&&e.message||e); }); };
    $("dPick").onclick=function(){ pickFolder().then(connected, function(e){ if(e&&e.name==="AbortError") return; $("dErr").textContent="폴더를 연결하지 못했습니다: "+(e&&e.message||e); }); };
  }
  function connected(){
    $("dConnect").innerHTML="";
    $("dFolder").textContent="📁 "+ROOT.name+(BASEH!==ROOT?"\\"+BASE:"")+" 연결됨";
    refreshDash(false);
    if(!TIMER) TIMER=setInterval(function(){ if(!$("dash").classList.contains("hidden") && !document.hidden) refreshDash(false); }, 30000);
    window.addEventListener("focus", function(){ if(!$("dash").classList.contains("hidden")) refreshDash(false); });
  }
  function refreshDash(manual){
    if(!ROOT || BUSY) return; BUSY=true;
    if(manual) $("dLog").textContent="새로고침 중…";
    sync().then(function(r){
      BUSY=false; if(r.log.length) LASTLOG=r.log;
      drawDash(r);
      $("dLog").textContent="마지막 확인 "+fmtStamp(new Date().toISOString())+" · 30초마다 자동으로 02_회수 폴더를 확인합니다.";
    }, function(e){
      BUSY=false;
      if(e && (e.name==="NotAllowedError" || e.name==="SecurityError")){ ROOT=null; connectCard("prompt"); return; }
      if(e && e.name==="NotFoundError"){ ROOT=null; connectCard("none"); return; }
      $("dLog").textContent="⚠ 폴더를 읽지 못했습니다: "+(e&&e.message||e)+" (NAS 연결을 확인한 뒤 [새로고침])";
    });
  }
  function drawDash(r){
    var c={draft:0,ceo_signed:0,signed:0};
    r.act.forEach(function(e){ c[e.P.stage]++; });
    $("dNotice").innerHTML = LASTLOG.length? '<div class="note '+(/^⚠/.test(LASTLOG[0])?'warn':'ok')+'" style="margin-bottom:14px">'+LASTLOG.map(esc).join("<br>")+'</div>' : '';
    var h='<div class="dsum">'+
      '<div><b>'+c.draft+'</b><span>대표 서명 대기</span></div>'+
      '<div><b>'+c.ceo_signed+'</b><span>입사자 서명 대기</span></div>'+
      '<div class="'+(c.signed?'hot':'')+'"><b>'+c.signed+'</b><span>확인·보관 필요</span></div>'+
      '<div><b>'+r.arch.length+'</b><span>보관 완료</span></div></div>';
    h+='<div class="dsec">진행 중</div>';
    if(!r.act.length) h+='<div class="dcard" style="text-align:center;color:var(--muted);font-size:13px">진행 중인 계약서가 없습니다. 오른쪽 위 <b>[+ 새 계약서 작성]</b>으로 시작하세요.</div>';
    else {
      h+='<table class="dt"><thead><tr><th>이름</th><th>소속 / 직책</th><th>입사일</th><th>연봉</th><th>상태</th><th>할 일</th><th></th></tr></thead><tbody>';
      r.act.forEach(function(e,i){
        var P=e.P, st=P.stage, pill, todo, btn, sent=!!lsGet(msgKey(P));
        if(st==="draft"){ pill='<span class="pill s0">대표 서명 대기</span>'; todo='대표에게 서명 요청 문자 보내기<small>'+(sent?'링크 준비됨 · 대표 서명본이 02_회수에 올라오면 자동 반영':'문자 보내기 전')+'</small>'; btn='<button class="btn primary" data-a="msg" data-i="'+i+'">문자 만들기</button>'; }
        else if(st==="ceo_signed"){
          if(!macOk(P)){ pill='<span class="pill bad">⚠ 서명본 이상</span>'; todo='대표 서명본이 원본과 다릅니다<small>대표에게 다시 서명 요청하세요</small>'; btn='<button class="btn" data-a="msg" data-i="'+i+'">보기</button>'; }
          else { pill='<span class="pill s1">입사자 서명 대기</span>'; todo='입사자에게 서명 안내 문자 보내기<small>'+(sent?'링크 준비됨 · 서명 완료본이 02_회수에 올라오면 자동 반영':'문자 보내기 전')+'</small>'; btn='<button class="btn primary" data-a="msg" data-i="'+i+'">문자 만들기</button>'; }
        } else {
          if(!macOk(P)){ pill='<span class="pill bad">⚠ 내용 변경됨</span>'; todo='원본과 다릅니다<small>사용하지 말고 대표에게 보고</small>'; btn='<button class="btn" data-a="rev" data-i="'+i+'">보기</button>'; }
          else { pill='<span class="pill s2">서명 완료</span>'; todo='원본 대조 확인 후 보관·인쇄<small>입사자 서명 '+esc(fmtStamp(P.employee.signedAt))+'</small>'; btn='<button class="btn go" data-a="rev" data-i="'+i+'">확인·보관</button>'; }
        }
        h+='<tr><td><b>'+esc(P.data.name)+'</b></td><td>'+esc(P.data.dept)+'</td><td>'+esc(P.data.date)+'</td><td>'+(P.data.salary?comma(P.data.salary)+'원':'')+'</td><td>'+pill+'</td><td class="todo">'+todo+'</td><td class="act">'+btn+'</td></tr>';
      });
      h+='</tbody></table>';
    }
    if(r.arch.length){
      h+='<div class="dsec">보관 완료 (03_최종보관)</div><table class="dt"><thead><tr><th>이름</th><th>소속 / 직책</th><th>입사일</th><th>문서번호</th><th>근로자 서명</th><th></th></tr></thead><tbody>';
      r.arch.slice(0,30).forEach(function(e,i){ var P=e.P;
        h+='<tr><td>'+esc(P.data.name)+'</td><td>'+esc(P.data.dept)+'</td><td>'+esc(P.data.date)+'</td><td>'+esc(P.docNo||"")+'</td><td>'+(P.employee?esc(fmtStamp(P.employee.signedAt)):"")+'</td><td class="act"><button class="btn" data-a="arch" data-i="'+i+'">열기·인쇄</button></td></tr>'; });
      h+='</tbody></table>';
    }
    $("dList").innerHTML=h;
    Array.prototype.forEach.call($("dList").querySelectorAll("button[data-a]"),function(b){
      b.onclick=function(){ var a=b.getAttribute("data-a"), i=+b.getAttribute("data-i");
        if(a==="msg") openMsg(r.act[i]);
        else if(a==="rev") reviewMode(r.act[i].P,{src:r.act[i]});
        else reviewMode(r.arch[i].P,{src:r.arch[i],archived:true});
      };
    });
  }
  function openMsg(e, notice){
    var P=e.P;
    show("app"); setLayout(false);
    setTop("안내 문자 보내기", P.stage==="draft"?"② 대표 서명 요청":"③ 입사자 서명 안내", homeBtn()); bindHome();
    renderDoc(P.data,sigs(P),opts(P));
    var label={draft:"대표 서명 대기 → ① 대표용 문자 + ③ 비밀번호를 보내세요.",ceo_signed:"입사자 서명 대기 → ② 입사자 안내 + ③ 비밀번호를 보내세요.",signed:"서명 완료 → 현황판에서 [확인·보관]을 누르세요."}[P.stage]||"";
    $("side").innerHTML=(notice? '<div class="note ok">'+esc(notice)+'</div>' : '')+
      '<h2>'+esc(P.data.name)+' 님</h2><div class="stagebox">'+esc(label)+'</div><div id="msgBox"></div>';
    msgPanel($("msgBox"), function(){ return P.data; }, function(){ return P.upload||""; }, P.stage,
      {key:msgKey(P), path: e.dir? "인사\\"+BASE+"\\"+e.dir+"\\"+e.name : "", P:P});
    window.scrollTo(0,0);
  }
  function manualCard(){
    $("dFolder").textContent="수동 모드";
    $("dConnect").innerHTML='<div class="dcard connect"><h2>이 브라우저는 폴더 자동 처리를 지원하지 않습니다</h2>'+
      '<p>인사 폴더 자동 저장·회수·보관은 <b>PC의 Chrome 또는 Edge</b>에서만 됩니다. 이 페이지 주소를 PC의 Chrome/Edge로 열어 주세요.<br>지금은 수동 방식으로 쓸 수 있습니다: 새 계약서는 파일로 다운로드되고, 받은 파일은 아래 버튼으로 엽니다.</p>'+
      '<button class="btn primary" id="dOpenFile" type="button">받은 계약서 파일 열기</button><input type="file" id="dFile" class="hidden"><div class="err" id="dErr" style="text-align:left"></div></div>';
    $("dOpenFile").onclick=function(){ $("dFile").value=""; $("dFile").click(); };
    $("dFile").onchange=function(){
      var f=this.files&&this.files[0]; if(!f) return;
      var rd=new FileReader(); rd.onload=function(){
        var P=null; try{ P=JSON.parse(rd.result); }catch(e){}
        if(!P||P.app!=="LK-CONTRACT"||!P.data){ $("dErr").textContent="리쿠스 근로계약서 파일(.lkc)이 아닙니다."; return; }
        if(P.stage==="signed" && P.employee) reviewMode(P); else openMsg({P:P});
      }; rd.readAsText(f);
    };
  }

  home();
})();
</script>
</body>
</html>
